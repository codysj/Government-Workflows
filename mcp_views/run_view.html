<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance review run</title>
<!--
  MCP Apps view (ui://govworkflows/run-view.html) for run_workflow / get_run.
  Rendered by Claude and ChatGPT in a sandboxed iframe; talks to the host over
  postMessage (JSON-RPC, MCP Apps spec 2026-01-26). Display only: every value
  shown comes from the tool result, nothing is computed here. No network access.
-->
<style>
  :root {
    color-scheme: light dark;
    --color-background-primary: light-dark(#ffffff, #1b1b1b);
    --color-background-secondary: light-dark(#f5f5f4, #262626);
    --color-text-primary: light-dark(#1c1917, #f5f5f4);
    --color-text-secondary: light-dark(#57534e, #a8a29e);
    --color-border-primary: light-dark(#e7e5e4, #3a3a3a);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --border-radius-md: 8px;
    --sev-critical: light-dark(#991b1b, #fca5a5);
    --sev-high: light-dark(#b91c1c, #f87171);
    --sev-medium: light-dark(#b45309, #fbbf24);
    --sev-low: light-dark(#1d4ed8, #93c5fd);
    --sev-info: light-dark(#57534e, #a8a29e);
    --ok: light-dark(#15803d, #4ade80);
    --bad: light-dark(#b91c1c, #f87171);
    --ai: light-dark(#6d28d9, #c4b5fd);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px 16px; font: 14px/1.45 var(--font-sans);
    color: var(--color-text-primary); background: var(--color-background-primary);
  }
  h1 { font-size: 16px; margin: 0; }
  .muted { color: var(--color-text-secondary); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
  .chip {
    border: 1px solid var(--color-border-primary); border-radius: 999px;
    padding: 2px 10px; font-size: 12px; background: var(--color-background-secondary);
  }
  .chip.ok { color: var(--ok); } .chip.bad { color: var(--bad); }
  details.group { border-top: 1px solid var(--color-border-primary); padding: 6px 0; }
  details.group > summary { cursor: pointer; font-weight: 600; }
  ul { margin: 6px 0 0; padding-left: 18px; }
  li { margin: 4px 0; }
  .sev { font-weight: 600; text-transform: capitalize; }
  .sev-critical { color: var(--sev-critical); } .sev-high { color: var(--sev-high); }
  .sev-medium { color: var(--sev-medium); } .sev-low { color: var(--sev-low); }
  .sev-info { color: var(--sev-info); }
  .ref {
    font: 11px var(--font-mono); background: var(--color-background-secondary);
    border-radius: 4px; padding: 0 4px; margin-right: 4px; white-space: nowrap;
  }
  table { border-collapse: collapse; font-size: 12px; margin: 4px 0; }
  td, th { border: 1px solid var(--color-border-primary); padding: 2px 6px; text-align: left; }
  .draft {
    margin-top: 12px; border: 1px dashed var(--ai); border-radius: var(--border-radius-md);
    padding: 10px 12px;
  }
  .draft h2 { font-size: 13px; margin: 0 0 6px; color: var(--ai); }
  .steps { margin: 0 0 10px; }
  footer { margin-top: 12px; }
</style>
</head>
<body>
<main id="app"><p class="muted">Waiting for the run result…</p></main>
<script>
"use strict";
const SEVERITIES = ["critical", "high", "medium", "low", "info"];
const app = document.getElementById("app");

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (k === "open") node.open = v; else node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c != null) node.append(c instanceof Node ? c : String(c));
  return node;
}

// run_workflow returns top_findings with "table:row" strings; get_run returns
// full findings with source_rows objects (and their cell values).
function normalize(r) {
  const full = Array.isArray(r.findings);
  const findings = (full ? r.findings : r.top_findings || []).map((f) => ({
    severity: f.severity || "info",
    type: f.finding_type || f.type,
    description: f.description,
    refs: (f.source_rows || []).map((s) => typeof s === "string" ? { ref: s }
      : { ref: `${s.table_name}:${s.row_index}`, values: s.source_values }),
  }));
  return {
    title: r.workflow_title || r.workflow_type || "Finance review run",
    runId: r.run_id, status: r.status,
    preflight: r.preflight && r.preflight.status ? String(r.preflight.status) : null,
    nextSteps: (r.preflight && Array.isArray(r.preflight.next_steps)) ? r.preflight.next_steps : [],
    total: r.findings_total ?? findings.length, findings,
    draft: r.ai_draft ?? (r.ai && r.ai.response && r.ai.response.summary),
    validation: r.ai_validation || r.validation,
    review: r.human_review_status ? String(r.human_review_status) : null,
  };
}

function render(result) {
  if (!result || typeof result !== "object") return;
  const r = normalize(result);
  const chips = el("div", { class: "chips" });
  if (r.preflight) chips.append(el("span", { class: "chip " + (r.preflight === "fail" ? "bad" : "ok") },
    `File check: ${r.preflight.toUpperCase()}`));
  chips.append(el("span", { class: "chip" }, `${r.total} finding${r.total === 1 ? "" : "s"}`));
  if (r.validation) chips.append(el("span", { class: "chip " + (r.validation.passed ? "ok" : "bad") },
    r.validation.passed ? "AI draft check: passed" : "AI draft check: rejected"));
  if (r.review) chips.append(el("span", { class: "chip" }, `Review: ${r.review.replaceAll("_", " ")}`));

  const body = [el("h1", {}, r.title), el("div", { class: "muted" }, `Run ${r.runId || ""} · ${r.status || ""}`), chips];
  if (r.nextSteps.length) body.push(el("ul", { class: "steps" }, r.nextSteps.map((s) => el("li", {}, s))));

  for (const sev of SEVERITIES) {
    const items = r.findings.filter((f) => f.severity === sev);
    if (!items.length) continue;
    body.push(el("details", { class: "group", open: sev !== "info" },
      el("summary", {}, el("span", { class: `sev sev-${sev}` }, sev), ` (${items.length})`),
      el("ul", {}, items.map((f) => el("li", {},
        f.description, " ",
        f.refs.map((s) => el("span", { class: "ref" }, s.ref)),
        f.refs.some((s) => s.values) ? el("details", {}, el("summary", { class: "muted" }, "Source values"),
          f.refs.filter((s) => s.values).map((s) => el("table", {},
            el("tr", {}, el("th", { colspan: "2" }, s.ref)),
            Object.entries(s.values).map(([k, v]) => el("tr", {}, el("td", {}, k), el("td", {}, v)))))) : null)))));
  }
  if (r.findings.length < r.total) {
    body.push(el("p", { class: "muted" }, `Showing ${r.findings.length} of ${r.total}; ask for the full run to see the rest.`));
  }
  if (r.draft) {
    const v = r.validation || {};
    body.push(el("section", { class: "draft" },
      el("h2", {}, "Draft — written by AI, verify before use"), el("div", {}, r.draft),
      el("p", { class: "muted" }, v.passed
        ? `Checked against your files: ${v.numeric_claims_checked ?? 0} claims verified, no invented references.`
        : `Rejected by the checker: ${(v.errors || []).map((e) => e.message || e).join("; ")}`)));
  }
  body.push(el("footer", { class: "muted" },
    "Every finding and figure was computed by code from your files. Approve or reject the draft in the review console."));
  app.replaceChildren(...body);
}

// --- MCP Apps host bridge (JSON-RPC over postMessage) ---------------------
let nextId = 1;
const pending = new Map();
const post = (msg) => window.parent.postMessage({ jsonrpc: "2.0", ...msg }, "*");
function request(method, params) {
  const id = nextId++;
  post({ id, method, params });
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}
function applyContext(ctx) {
  if (!ctx) return;
  if (ctx.theme) document.documentElement.style.colorScheme = ctx.theme;
  for (const [k, v] of Object.entries((ctx.styles && ctx.styles.variables) || {})) {
    if (v) document.documentElement.style.setProperty(k, v);
  }
}
function showError(params) {
  const text = ((params && params.content) || []).filter((c) => c.type === "text").map((c) => c.text).join(" ");
  app.replaceChildren(el("p", {}, text || "The tool reported an error."));
}
function resultOf(params) {
  if (params && params.structuredContent) return params.structuredContent;
  const text = params && (params.content || []).find((c) => c.type === "text");
  try { return text ? JSON.parse(text.text) : null; } catch { return null; }
}
window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  const msg = event.data || {};
  if (msg.id != null && pending.has(msg.id) && !msg.method) {
    const p = pending.get(msg.id); pending.delete(msg.id);
    msg.error ? p.reject(msg.error) : p.resolve(msg.result);
  } else if (msg.method === "ui/notifications/tool-result") {
    if (msg.params && msg.params.isError) showError(msg.params); else render(resultOf(msg.params));
  } else if (msg.method === "ui/notifications/host-context-changed") {
    applyContext(msg.params);
  } else if (msg.method === "ui/resource-teardown" && msg.id != null) {
    post({ id: msg.id, result: {} });
  }
});
// Body height (not the document's) so the frame can also shrink.
const reportSize = () => post({ method: "ui/notifications/size-changed", params: {
  width: Math.ceil(document.body.getBoundingClientRect().width),
  height: Math.ceil(document.body.getBoundingClientRect().height) } });
request("ui/initialize", {
  appInfo: { name: "govworkflows-run-view", version: "1.0.0" },
  appCapabilities: {},
  protocolVersion: "2026-01-26",
}).then((res) => {
  applyContext(res && res.hostContext);
  post({ method: "ui/notifications/initialized", params: {} });
  new ResizeObserver(reportSize).observe(document.body);  // only after the handshake
}).catch(() => {});
// ChatGPT's older bridge exposes the result directly (and announces updates).
const fromOpenAI = () => window.openai && window.openai.toolOutput && render(window.openai.toolOutput);
fromOpenAI();
window.addEventListener("openai:set_globals", fromOpenAI);
</script>
</body>
</html>
